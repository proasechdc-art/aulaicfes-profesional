<script>
const AULACFG=window.AULAICFES_CONFIG||{};
if(!AULACFG.SUPABASE_URL||!AULACFG.SUPABASE_PUBLISHABLE_KEY||AULACFG.SUPABASE_URL.includes('REEMPLAZAR')){console.error('Configura config.js con la URL y la clave publicable de tu nuevo proyecto Supabase.');}
const sb=supabase.createClient(AULACFG.SUPABASE_URL||'https://REEMPLAZAR.supabase.co',AULACFG.SUPABASE_PUBLISHABLE_KEY||'REEMPLAZAR');
const IMG=(AULACFG.SUPABASE_URL||'https://REEMPLAZAR.supabase.co')+'/storage/v1/object/public/question-images/';
const LOGO=(AULACFG.SUPABASE_URL||'https://REEMPLAZAR.supabase.co')+'/storage/v1/object/public/school-logos/';
const MEDALS={first:['🥇','Primer Paso','Completar tu primer simulacro'],perfect:['🧠','Mente Brillante','100% de respuestas correctas'],clock:['⏱️','Contra el Reloj','Terminar con más de la mitad del tiempo restante'],streak:['🔥','Constante','Completar 3 simulacros'],high:['⭐','Alto Puntaje','Obtener 80 o más']};
const isDir=()=>!!M&&(M.role==='rector'||M.role==='coordinador');
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Celda CSV segura: neutraliza fórmulas (=, +, -, @, tab, CR) que Excel ejecutaría al abrir el archivo. */
const csvCell=x=>{let t=String(x??'');if(typeof x!=='number'&&/^[=+\-@\t\r]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"'};
/* Fecha local AAAA-MM-DD (toISOString usa UTC y en Colombia cambia de día a las 7 p. m.). */
const hoy=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;

function calEval(it){

    if(ov==='X')why='anulada por el docente';else if(ov)letter=ov;
    else if(v.st==='ok')letter=v.r;else if(v.st==='revisar'){why='relleno incompleto';pend=true}else why=v.r;
    if(letter){const c=letter===K[q-1];if(c)o.ok++;else o.bad++;o.ans[q]={r:letter,c:c?1:0}}
    else{o.anu++;if(pend)o.rev++;o.reasons[why]=(o.reasons[why]||0)+1;o.ans[q]={m:why}}
    if(v.st!=='ok'||ov)o.list.push({q,v,ov,letter,why,pend})}
  o.nota=o.n?Math.round(50*o.ok/o.n)/10:0;o.pct=o.n?Math.round(100*o.ok/o.n):0;return o}

const FMT={excel:'Excel o CSV',word:'Word',pdf:'PDF',text:'texto'};
const ACC={excel:'.xlsx,.xls,.csv',word:'.docx',pdf:'.pdf'};
const LIB={xlsx:'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',mammoth:'https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js',pdf:'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js',pdfw:'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'};
const LOADED={};
function loadScript(src){
  if(!LOADED[src])LOADED[src]=new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>{delete LOADED[src];ko(new Error('No se pudo cargar la herramienta para leer el archivo. Revisa tu conexión a internet.'))};document.head.appendChild(s)});
  return LOADED[src];
}
const EMAIL_RE=/[^\s@;,|<>()]+@[^\s@;,|<>()]+\.[^\s@;,|<>()]+/;
const DOC_RE=/^\d{1,3}(?:\.\d{3})+$|^\d{6,12}$/;
function parseLine(line){
  const m=line.match(EMAIL_RE),email=m?m[0].toLowerCase().replace(/[.]+$/,''):'';
  const toks=(m?line.replace(m[0],' '):line).split(/[;,\t|]+/).join(' ').split(/\s+/).filter(Boolean);
  let doc='';const nt=[];
  toks.forEach(t=>{
    if(!doc&&DOC_RE.test(t)){const d=t.replace(/\./g,'');if(!(d.length===10&&d[0]==='3')){doc=d;return}}
    if(/^\d+[.)-]?$/.test(t)||/^\d{1,2}[°º]?[A-Za-zñÑ]?$/.test(t))return;
    nt.push(t);
  });
  const name=nt.join(' ').trim();
  if(!name||(!email&&!doc))return null;
  return{email,full_name:name,document:doc};
}
async function readFile(file,f){
  const lines=[];
  if(f==='excel'){
    await loadScript(LIB.xlsx);
    const isCsv=/\.csv$/i.test(file.name);
    const wb=isCsv?XLSX.read(await file.text(),{type:'string'}):XLSX.read(await file.arrayBuffer(),{type:'array'});
    wb.SheetNames.forEach(n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''}).forEach(r=>lines.push(r.map(x=>String(x).trim()).filter(Boolean).join(' ; '))));
  }
  if(f==='word'){
    await loadScript(LIB.mammoth);
    const r=await mammoth.convertToHtml({arrayBuffer:await file.arrayBuffer()});
    const doc=new DOMParser().parseFromString(r.value,'text/html');
    doc.querySelectorAll('tr').forEach(tr=>lines.push([...tr.children].map(c=>c.textContent.trim()).filter(Boolean).join(' ; ')));
    doc.querySelectorAll('p,li').forEach(p=>{if(!p.closest('table'))lines.push(p.textContent.trim())});
  }
  if(f==='pdf'){
    await loadScript(LIB.pdf);pdfjsLib.GlobalWorkerOptions.workerSrc=LIB.pdfw;
    const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
    for(let p=1;p<=pdf.numPages;p++){
      const tc=await(await pdf.getPage(p)).getTextContent(),rows={};
      tc.items.forEach(it=>{if(!it.str.trim())return;const y=Math.round(it.transform[5]/3);(rows[y]=rows[y]||[]).push({x:it.transform[4],t:it.str})});
      Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y=>lines.push(rows[y].sort((a,b)=>a.x-b.x).map(i=>i.t.trim()).join(' ')));
    }
    if(!lines.length)throw new Error('No encontré texto en el PDF. Si es un PDF escaneado (una foto), usa Excel o Word.');
  }
  return lines;
}
function setRows(lines){
  const seen=new Set(),rows=[],bad=[],sk=[];let skip=0;
  lines.forEach(l=>{l=(l||'').trim();if(!l)return;const p=parseLine(l);
    if(!p){if(/[A-Za-zÁ-ú]/.test(l)){skip++;if(sk.length<15)sk.push(l)}return}
    p.document=(p.document||'').replace(/\D/g,'');
    const palabras=p.full_name.trim().split(/\s+/).filter(w=>/[A-Za-zÁ-ú]/.test(w)),why=[];
    if(p.document.length<5)why.push('falta el número de documento');
    if(palabras.length<2)why.push('falta el nombre completo (nombres y apellidos)');
    if(why.length){bad.push({l,why:why.join(' y ')});return}
    if(seen.has(p.document))return;seen.add(p.document);rows.push(p)});
  RF.rows=rows;RF.skip=skip;RF.sk=sk;RF.bad=bad;
  if(!rows.length)toast('⚠️','No encontré estudiantes válidos','Cada fila debe tener el nombre completo y el número de documento del estudiante.');
}

  if(!okx.includes(ext))return toast('⚠️','El archivo no coincide con el formato','Elegiste '+FMT[RF.f]+' pero el archivo es .'+ext+'. Cambia el formato o el archivo.');

async function bulk(patch,txt){

  const{error}=await sb.from('questions').update(patch).eq('grade',QF.g).eq('subject',QF.s);
  if(error)return err(error);toast('✅','Listo',txt+': '+QF.s+' '+QF.g+'°');go('preg');
}

/* ---------- Simulacro (estudiante) ---------- */
async function startSim(simId){
  const sim=(D.sims||[]).find(x=>x.id===simId);if(!sim)return;
  const secs=sim.minutes_per_question*60,n=sim.n_questions;
  const{data,error}=await sb.from('questions').select('id,part,body,options,image_path,stimulus_title,stimulus_content').eq('grade',sim.grade).eq('subject',sim.subject).eq('active',true);
  if(error)return err(error);
  if(data.length<n)return toast('⚠️','No disponible','Hay '+data.length+' preguntas visibles y se piden '+n+'. Avisa a tu docente.');
  const qs=data.sort(()=>Math.random()-.5).slice(0,n);
  const total=qs.length*secs;
  S={grade:sim.grade,subject:sim.subject,qs,ans:{},total,left:total,end:Date.now()+total*1000,i:0,sending:false,simId:sim.id,title:sim.title};
  clearInterval(timer);
  timer=setInterval(()=>{if(!S)return;S.left=Math.max(0,Math.round((S.end-Date.now())/1000));const e=document.getElementById('clk');if(e){e.textContent=fmt(S.left);e.className='font-mono text-2xl font-bold '+(S.left<30?'text-red-600':'text-indigo-700')}if(S.left<=0)finish(true)},1000);
  render();
}
async function finish(auto){
  if(!S||S.sending)return;S.sending=true;clearInterval(timer);
  const answers=Object.fromEntries(S.qs.map(q=>[q.id,S.ans[q.id]??null]));
  const{data,error}=await sb.rpc('submit_attempt',{p_grade:S.grade,p_subject:S.subject,p_answers:answers,p_seconds_left:Math.max(0,S.left),p_auto:!!auto,p_simulacro_id:S.simId});
  if(error){S.sending=false;return err(error)}
  RES={...data,auto,qs:S.qs,ans:S.ans};S=null;
  (data.new_medals||[]).forEach(k=>{const m=MEDALS[k];if(m)toast(m[0],'¡Medalla desbloqueada: '+m[1]+'!',m[2])});
  render();
}

/* ---------- CSV ---------- */
function exportCSV(){
  const esc=csvCell;
  const rows=[['Estudiante','Curso','Grado','Materia','Simulacro o tarea','Puntaje','Fecha']].concat((D.all||[]).map(a=>[a.profiles?.full_name,a.profiles?.courses?.name||'',a.grade+'°',a.subject,a.simulacros?.title||'(sin asignar)',a.score,new Date(a.created_at).toLocaleString('es-CO')]));
  const blob=new Blob(['\ufeff'+rows.map(r=>r.map(esc).join(',')).join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='historial_notas.csv';document.body.appendChild(a);a.click();a.remove();
}

  <div class="text-sm"><div class="font-semibold mb-2">Activar para los cursos de ${SF.g}°:</div>${gc.length?`<div class="flex flex-wrap gap-3">${gc.map(c=>`<label class="flex items-center gap-2"><input type="checkbox" ${SF.cs.includes(c.id)?'checked':''} onchange="togC('${c.id}',this.checked)"> ${E(c.name)}</label>`).join('')}<button onclick="allC()" class="px-3 py-1 rounded-lg bg-slate-200 text-xs">Marcar todos</button></div>`:'<p class="text-slate-500">No tienes cursos de este grado. Agrégalos en la pestaña Cursos y estudiantes.</p>'}</div>
  <p class="text-xs text-slate-500">Hay ${have} preguntas visibles en ${E(SF.s)} (${SF.g}°). Tiempo total: <b>${SF.n*SF.m} minutos</b>. Cada estudiante recibe ${SF.n} preguntas al azar.</p>
  <button onclick="createSim()" class="px-5 py-2 bg-emerald-600 text-white rounded-lg">Activar ${kn}</button></div>
  <div class="bg-white rounded-2xl p-4 shadow space-y-3"><h3 class="font-semibold">Simulacros y tareas activados</h3>${sims.length?sims.map(s=>{const asg=(s.simulacro_targets||[]).map(t=>t.course_id),free=cs.filter(c=>c.grade===s.grade&&!asg.includes(c.id));return`<div class="border rounded-xl p-3 space-y-2 ${s.active?'':'bg-slate-100'}"><div class="flex flex-wrap items-center justify-between gap-2"><div><div class="font-semibold">${s.kind==='tarea'?'📘 Tarea':'📝 Simulacro'} · ${E(s.title)}</div><div class="text-xs text-slate-500">${s.grade}° · ${E(s.subject)} · ${s.n_questions} preguntas · ${s.minutes_per_question} min c/u · ${s.max_attempts} intento(s)${s.due_at?' · hasta '+new Date(s.due_at).toLocaleDateString('es-CO'):''} · ${s.active?'👁 Activo':'🚫 Desactivado'}</div></div><div class="flex gap-2"><button onclick="setSim('${s.id}',{active:${!s.active}})" class="px-3 py-1.5 rounded-lg ${s.active?'bg-slate-200':'bg-emerald-600 text-white'} text-xs">${s.active?'Desactivar':'Activar'}</button><button onclick="delSim('${s.id}','${E(s.title).replace(/'/g,'')}')" class="px-3 py-1.5 rounded-lg bg-slate-200 text-xs">Borrar</button></div></div>
  <div class="flex flex-wrap items-center gap-2 text-xs"><span class="text-slate-500">Cursos:</span>${asg.length?asg.map(id=>`<span class="px-3 py-1 rounded-lg bg-indigo-50 border border-indigo-600">${E((cs.find(c=>c.id===id)||{name:'?'}).name)} <a href="#" onclick="delT('${s.id}','${id}');return false" class="text-red-600">✕</a></span>`).join(''):'<span class="text-red-600">Sin cursos: nadie lo ve</span>'}${free.length?`<select id="add_${s.id}" class="border rounded-lg p-2"><option value="">Agregar curso…</option>${free.map(c=>`<option value="${c.id}">${E(c.name)}</option>`).join('')}</select><button onclick="addT('${s.id}')" class="px-3 py-1.5 rounded-lg bg-slate-200">Agregar</button>`:''}</div></div>`}).join(''):'<p class="text-sm text-slate-500">Aún no has activado ninguno.</p>'}</div></div>`}
function vMed(){const md=D.medals||{};return`<div class="bg-white rounded-2xl p-6 shadow"><h2 class="text-xl font-bold mb-4">🏆 Panel de trofeos</h2><div class="grid sm:grid-cols-3 gap-3">${Object.entries(MEDALS).map(([k,m])=>{const on=md[k];return`<div class="p-4 rounded-xl border text-center ${on?'bg-amber-50 border-amber-300':'bg-slate-50 opacity-60'}"><div class="text-4xl ${on?'':'grayscale'}">${m[0]}</div><div class="font-semibold mt-1">${m[1]}</div><div class="text-xs text-slate-600">${m[2]}</div><div class="text-xs mt-1">${on?'✅ '+new Date(on).toLocaleDateString('es-CO'):'🔒 Bloqueada'}</div></div>`}).join('')}</div></div>`}
function vEst(){return(D.mine||[]).length?`<div class="grid md:grid-cols-2 gap-4"><div class="bg-white rounded-2xl p-4 shadow"><h3 class="font-semibold mb-2">Rendimiento por materia</h3><canvas id="c1"></canvas></div><div class="bg-white rounded-2xl p-4 shadow"><h3 class="font-semibold mb-2">Evolución de puntajes</h3><canvas id="c2"></canvas></div></div>`:`<div class="bg-white rounded-2xl p-6 shadow text-center text-slate-600">Aún no tienes intentos. ¡Presenta tu primer simulacro!</div>`}
function vLb(){return`<div class="bg-white rounded-2xl p-4 shadow"><h3 class="font-semibold mb-2">🏅 Leaderboard${M.role==='prof'?' de tus estudiantes':' de tu curso'}</h3><table class="w-full text-sm"><tr class="text-left text-slate-500"><th>#</th><th>Estudiante</th><th>Grado</th><th>Prom.</th></tr>${(D.lb||[]).map((r,i)=>`<tr class="border-t"><td>${['🥇','🥈','🥉'][i]||i+1}</td><td>${E(r.full_name)}</td><td>${r.grade??''}°</td><td class="font-bold">${r.avg_score}</td></tr>`).join('')}</table></div>`}
function vProf(){const all=D.all||[],students=new Set(all.map(a=>a.profiles?.full_name).filter(Boolean)).size,mean=all.length?Math.round(all.reduce((n,a)=>n+(Number(a.score)||0),0)/all.length):0,subjects=new Set(all.map(a=>a.subject).filter(Boolean)).size;return`<div class="space-y-4"><div class="dashboard-hero"><div><div class="dashboard-eyebrow">RESUMEN ACADÉMICO</div><h2>Hola, ${E((M.full_name||'docente').split(/\s+/)[0])} 👋</h2><p>Consulta el avance de tus estudiantes, identifica oportunidades de mejora y administra tus actividades desde un solo lugar.</p></div><button onclick="exportCSV()" class="dashboard-export">↧ Exportar historial</button><div class="dashboard-hero-orb"></div></div>
  <div class="dashboard-kpis"><div class="dashboard-kpi"><div class="kpi-top"><span>Intentos registrados</span><span class="kpi-icon">▤</span></div><strong>${all.length}</strong><small>Evaluaciones realizadas</small></div><div class="dashboard-kpi"><div class="kpi-top"><span>Estudiantes activos</span><span class="kpi-icon">♙</span></div><strong>${students}</strong><small>Con resultados registrados</small></div><div class="dashboard-kpi"><div class="kpi-top"><span>Promedio general</span><span class="kpi-icon">↗</span></div><strong>${mean}<em>/100</em></strong><small>Sobre los intentos cargados</small></div><div class="dashboard-kpi"><div class="kpi-top"><span>Áreas evaluadas</span><span class="kpi-icon">▦</span></div><strong>${subjects}</strong><small>Materias con resultados</small></div></div>
  <div class="grid md:grid-cols-2 gap-4"><div class="bg-white rounded-2xl p-4 shadow"><h3 class="font-semibold mb-2">Promedio de tus estudiantes por materia</h3>${all.length?'<canvas id="c3"></canvas>':'<p class="text-sm text-slate-500">Sin intentos todavía.</p>'}</div>${vLb()}</div>
  <div class="bg-white rounded-2xl p-4 shadow overflow-x-auto"><h3 class="font-semibold mb-2">Historial de notas (últimos 15)</h3><table class="w-full text-sm"><tr class="text-left text-slate-500"><th>Estudiante</th><th>Curso</th><th>Materia</th><th>Simulacro o tarea</th><th>Puntaje</th><th>Fecha</th></tr>${all.slice(0,15).map(a=>`<tr class="border-t"><td>${E(a.profiles?.full_name)}</td><td>${E(a.profiles?.courses?.name||'')}</td><td>${E(a.subject)}</td><td>${E(a.simulacros?.title||'(sin asignar)')}</td><td>${a.score}</td><td>${new Date(a.created_at).toLocaleDateString('es-CO')}</td></tr>`).join('')}</table></div></div>`}
function vPreg(){
  const adm=!!M.is_admin,av=D.pav||{},gs=Object.keys(av).map(Number).sort((a,b)=>a-b);
  if(!gs.length)return`<div class="bg-white rounded-2xl p-6 shadow text-center text-slate-600">No hay preguntas visibles de tu asignatura todavía.</div>`;
  const subs=Object.keys(av[QF.g]||{}).sort(),st=D.pstat||{on:0,rev:0,tot:0},pages=Math.max(1,Math.ceil((D.pn||0)/10));
  const F=[['all','Todas'],['on','Visibles'],['off','Ocultas'],['draft','En borrador'],['rev','Revisadas']];
  return`<div class="space-y-4"><div class="bg-white rounded-2xl p-4 shadow space-y-3"><h2 class="text-xl font-bold">📚 ${adm?'Revisión del banco de preguntas':'Banco de preguntas de tu asignatura'}</h2>${adm?'':`<p class="text-sm text-slate-600">Ves las preguntas activas de tu asignatura (${E((M.asignaturas||[]).join(', '))}). Solo el administrador puede revisarlas, activarlas u ocultarlas.</p>`}
  <div class="grid sm:grid-cols-3 gap-3"><label class="text-sm">Grado<select class="w-full border rounded-lg p-2 mt-1" onchange="QF.g=+this.value;QF.s='';QF.p=0;go('preg')">${gs.map(g=>`<option ${g==QF.g?'selected':''}>${g}</option>`).join('')}</select></label>
  <label class="text-sm">Materia<select class="w-full border rounded-lg p-2 mt-1" onchange="QF.s=this.value;QF.p=0;go('preg')">${subs.map(s=>`<option ${s==QF.s?'selected':''}>${E(s)}</option>`).join('')}</select></label>
  ${adm?`<label class="text-sm">Mostrar<select class="w-full border rounded-lg p-2 mt-1" onchange="QF.f=this.value;QF.p=0;go('preg')">${F.map(([k,l])=>`<option value="${k}" ${k==QF.f?'selected':''}>${l}</option>`).join('')}</select></label>`:''}</div>
  <p class="text-sm text-slate-600">${E(QF.s)} · ${QF.g}°: <b>${st.tot}</b> preguntas${adm?` · <b>${st.on}</b> visibles para estudiantes · <b>${st.rev}</b> revisadas`:''}</p>
  ${adm?`<div class="flex flex-wrap gap-2"><button onclick="bulk({active:true},'Mostrar')" class="px-4 py-2 rounded-lg bg-emerald-600 text-white text-sm">Mostrar todas</button><button onclick="bulk({active:false},'Ocultar')" class="px-4 py-2 rounded-lg bg-slate-200 text-sm">Ocultar todas</button><button onclick="bulk({status:'published'},'Marcar como revisadas')" class="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm">Marcar todas revisadas</button></div>`:''}</div>
  ${(D.pq||[]).map(q=>{const kk=Array.isArray(q.question_keys)?q.question_keys[0]:q.question_keys,c=kk?kk.correct:-1;return`<div class="border rounded-xl p-4 space-y-2 text-sm ${q.active?'bg-white':'bg-slate-100'}"><div class="flex flex-wrap justify-between gap-2 text-xs text-slate-500"><span>${E(q.ext_id||'ejemplo')} · ${E(q.difficulty||'')}</span>${adm?`<span>${q.active?'👁 Visible':'🚫 Oculta'} · ${q.status==='published'?'✅ Revisada':'📝 Borrador'}</span>`:''}</div>
  ${vQBody(q,false)}
  <div class="grid sm:grid-cols-2 gap-2">${q.options.map((o,i)=>`<div class="p-2 rounded-lg border border-slate-200 ${i===c?'bg-emerald-50':''}"><b>${'ABCD'[i]}.</b>${q.image_path?'':' '+E(o)}${i===c?' ✅':''}</div>`).join('')}</div>
  ${kk&&kk.explanation?`<div class="text-slate-600">💡 ${E(kk.explanation)}</div>`:''}
  ${adm?`<div class="flex flex-wrap gap-2"><button onclick="setQ('${q.id}',{active:${!q.active}})" class="px-3 py-1.5 rounded-lg ${q.active?'bg-slate-200':'bg-emerald-600 text-white'} text-xs">${q.active?'Ocultar a estudiantes':'Mostrar a estudiantes'}</button><button onclick="setQ('${q.id}',{status:'${q.status==='published'?'draft':'published'}'})" class="px-3 py-1.5 rounded-lg ${q.status==='published'?'bg-slate-200':'bg-indigo-600 text-white'} text-xs">${q.status==='published'?'Volver a borrador':'Marcar como revisada'}</button></div>`:''}</div>`}).join('')||'<div class="bg-white rounded-2xl p-6 shadow text-center text-slate-600">No hay preguntas con ese filtro.</div>'}
  <div class="flex justify-between items-center"><button ${QF.p?'':'disabled'} onclick="QF.p--;go('preg')" class="px-4 py-2 rounded-lg bg-slate-200 disabled:opacity-40">← Anterior</button><span class="text-sm text-slate-600">Página ${QF.p+1} de ${pages}</span><button ${QF.p+1<pages?'':'disabled'} onclick="QF.p++;go('preg')" class="px-4 py-2 rounded-lg bg-indigo-600 text-white disabled:opacity-40">Siguiente →</button></div></div>`}
function vVideo(){
  const c=D.cls||{},prof=M.role==='prof',live=!!(c.is_live&&c.video_url);
  const badge=live?'<span style="background:#dc2626;color:#fff;padding:1px 10px;border-radius:9999px">● EN VIVO</span>':'<span class="text-slate-500">⚪ Sin clase en vivo</span>';
  if(prof)return`<div class="flex justify-between text-xs mb-2"><span>${badge}</span></div><div class="space-y-3"><label class="text-sm block">Título de la clase<input id="ct" class="w-full border rounded-lg p-2 mt-1" value="${E(c.title||'')}"></label>
  <label class="text-sm block">Enlace de la reunión (Meet, Zoom o Jitsi, debe empezar con https://)<input id="cu" class="w-full border rounded-lg p-2 mt-1" placeholder="https://meet.google.com/abc-defg-hij" value="${E(c.video_url||'')}"></label>
  <label class="text-sm flex items-center gap-2"><input id="cl" type="checkbox" ${c.is_live?'checked':''}> Clase en vivo (los estudiantes verán el botón para unirse)</label>
  <div class="flex flex-wrap gap-2 items-center"><button onclick="saveClass()" class="px-4 py-2 rounded-lg bg-emerald-600 text-white">Guardar</button><a href="https://meet.google.com/new" target="_blank" rel="noopener noreferrer" class="text-sm text-indigo-600 underline">Crear reunión nueva en Google Meet</a>${live?`<a href="${E(c.video_url)}" target="_blank" rel="noopener noreferrer" class="text-sm text-indigo-600 underline">Abrir mi clase</a>`:''}</div></div>`;
  return`<div class="flex justify-between text-xs mb-2"><span>${badge} · ${E(c.title||'Clase')}</span></div>${live?`<div class="text-center space-y-2 p-4"><div class="text-4xl">🎥</div><p class="text-sm text-slate-600">Tu docente ya inició la clase.</p><a href="${E(c.video_url)}" target="_blank" rel="noopener noreferrer" class="inline-block px-5 py-2 rounded-lg bg-emerald-600 text-white">Unirme a la clase</a></div>`:`<div class="text-center p-4 text-sm text-slate-500"><div class="text-4xl">🕒</div>Tu docente aún no ha iniciado la clase. Esta pantalla se actualiza sola.</div>`}`}
function paintVideo(){const b=document.getElementById('vbox');if(b)b.innerHTML=vVideo()}
function vClase(){const prof=M.role==='prof';return`<div class="grid lg:grid-cols-3 gap-4"><div class="lg:col-span-2 space-y-3"><div id="vbox" class="bg-white rounded-2xl p-4 shadow">${vVideo()}</div>
  <div class="bg-white rounded-2xl p-4 shadow"><h3 class="font-semibold mb-2">Asistencia de hoy</h3>${prof?`<div class="grid sm:grid-cols-2 gap-2">${(D.est||[]).map(u=>`<label class="flex items-center gap-2 p-2 border rounded-lg text-sm"><input type="checkbox" ${D.att[u.id]?'checked':''} onchange="toggleAtt('${u.id}',this.checked)"> ${E(u.full_name)} <span class="text-slate-400">${u.grade??''}°</span></label>`).join('')||'<p class="text-sm text-slate-500">Aún no tienes estudiantes registrados.</p>'}</div>`:`<button onclick="toggleAtt(M.id,${!D.me})" class="px-4 py-2 rounded-lg ${D.me?'bg-emerald-600':'bg-indigo-600'} text-white">${D.me?'✅ Asistencia marcada':'Marcar mi asistencia'}</button>`}</div></div>
  <div class="bg-white rounded-2xl p-4 shadow flex flex-col h-[28rem]"><h3 class="font-semibold mb-2">💬 Chat</h3><div id="chatbox" class="flex-1 overflow-y-auto space-y-2 text-sm"></div><div class="flex gap-2 mt-2"><input id="msg" onkeydown="if(event.key==='Enter')sendChat()" class="flex-1 border rounded-lg p-2 text-sm" placeholder="Escribe un mensaje…"><button onclick="sendChat()" class="px-3 bg-indigo-600 text-white rounded-lg">➤</button></div></div></div>`}
function paintChat(){const b=document.getElementById('chatbox');if(!b)return;b.innerHTML=(D.chat||[]).slice(-50).map(c=>`<div class="${c.user_id===M.id?'text-right':''}"><span class="text-[11px] text-slate-500">${E(c.author_name)}</span><div class="block"><span class="inline-block bg-slate-100 rounded-lg px-3 py-1">${E(c.body)}</span></div></div>`).join('');b.scrollTop=b.scrollHeight}

function render(){
  charts.forEach(c=>c.destroy());charts=[];
  const root=document.getElementById('app');
  if(!M){root.innerHTML=authShell(vAuth());return}
  if(M.role==='prof'&&M.teacher_status!=='aprobado'){root.innerHTML=authShell(vPend());return}
  if(isDir()&&M.teacher_status!=='aprobado'){root.innerHTML=authShell(vPendDir());return}
  const prof=M.role==='prof';
  const adm=!!M.is_admin;
  const tabs=adm?admTabs():isDir()?dirTabs():prof?[['prof','📊 Panel'],['cur','👥 Cursos y estudiantes'],['simp','🚀 Simulacros y tareas'],['imp','🖨️ Imprimir'],['cal','📷 Calificar'],['preg','📚 Preguntas'],['clase','🎥 Clase'],['mhor','🗓 Mi horario']]:[['sim','📝 Mis simulacros y tareas'],['est','📊 Mis estadísticas'],['med','🏆 Logros'],['lb','🏅 Ranking'],['clase','🎥 Clase']];
  const body=({sim:vSim,simp:vSimP,cur:vCur,imp:vImp,cal:vCal,doc:vDoc,est:vEst,med:vMed,prof:vProf,preg:vPreg,clase:vClase,lb:vLb}[tab]||(()=>['ares','arec','acoo','adoc','acat','ahist'].includes(tab)?(window.ADM?ADM.view(tab):''):tab==='banco'?(window.BANCO?BANCO.view():''):['dhor','mhor'].includes(tab)?(window.HZUI?HZUI.view(tab):''):window.DIR?DIR.view(tab):''))();
  const roleKey=adm?'admin':M.role==='rector'?'rector':M.role==='coordinador'?'coordinador':prof?'docente':'estudiante';
  const roleLabel={admin:'Administrador',rector:'Rector',coordinador:'Coordinador',docente:'Docente',estudiante:'Estudiante'}[roleKey];
  const roleTag={admin:'Administración general',rector:'Rectoría',coordinador:'Coordinación',docente:'Aula docente',estudiante:'Zona de estudio'}[roleKey];
  const cleanLabel=x=>String(x||'').replace(/^[^A-Za-zÁÉÍÓÚÜÑ0-9]+/,'').replace(/\s*\([^)]*\)/g,'').trim();
  const activeLabel=cleanLabel((tabs.find(x=>x[0]===tab)||['','Panel principal'])[1]);
  const navButton=([k,l])=>`<button onclick="go('${k}')" class="aula-nav ${tab===k?'active':''}" title="${E(cleanLabel(l))}"><span class="navdot">${(l.match(/^[^A-Za-zÁÉÍÓÚÜÑ0-9]+/)||['•'])[0].trim()||'•'}</span><span>${E(cleanLabel(l))}</span></button>`;
  const coreTabs=tabs.filter(x=>(adm?['ares','arec','acoo','adoc','ahist']:['sim','est','prof','dcol','cur','simp','preg','banco']).includes(x[0]));
  const manageTabs=tabs.filter(x=>!coreTabs.includes(x));
  const initials=String(M.full_name||'A').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase();
  root.innerHTML=`<div class="aula-shell" data-role="${roleKey}">
    <aside class="aula-sidebar"><div class="aula-brand"><div class="aula-brandmark">🎓</div><div><div class="aula-brandname">AulaICFES</div><div class="aula-brandtag">${E(roleTag)}</div></div></div>
      <div class="aula-navgroup"><div class="aula-navlabel">${adm?'Supervisión':'Principal'}</div>${coreTabs.map(navButton).join('')}</div>
      ${manageTabs.length?`<div class="aula-navgroup"><div class="aula-navlabel">${adm?'Plataforma':'Gestión académica'}</div>${manageTabs.map(navButton).join('')}</div>`:''}
      <div class="aula-sidefoot"><div class="aula-avatar">${E(initials)}</div><div><div class="aula-sidefootname">${E(M.full_name||'Usuario')}</div><div class="aula-sidefootrole">${E(roleLabel)} · AulaICFES</div></div></div>
    </aside>
    <main class="aula-main"><header class="aula-topbar"><div><div class="aula-crumb">AULAICFES <span style="padding:0 5px;color:#c0c5d2">/</span> ${E(activeLabel.toUpperCase())}</div><div class="aula-pagetitle">${E(activeLabel)}</div></div><div class="aula-topactions"><button class="aula-iconbtn" onclick="passModal()" title="Cambiar contraseña" aria-label="Cambiar contraseña">🔑</button><button class="aula-iconbtn" onclick="logout()" title="Cerrar sesión" aria-label="Cerrar sesión">↗</button><div class="aula-profile"><div class="aula-avatar">${E(initials)}</div><div><div class="aula-profile-name">${E(M.full_name||'Usuario')}</div><div class="aula-profile-sub">${E(roleLabel)}</div></div></div></div></header>
    <nav class="aula-mobilebar">${tabs.map(navButton).join('')}</nav><div id="livebar" class="aula-live">${adm?'':vLive()}</div><section class="aula-content">${body}</section></main></div>`;
  if(tab==='clase')paintChat();
  if(!window.Chart)return;
  const by=l=>{const m={};l.forEach(a=>(m[a.subject]=m[a.subject]||[]).push(a.score));return Object.entries(m).map(([k,x])=>[k,avg(x)])};
  if(tab==='est'&&(D.mine||[]).length){const sj=by(D.mine);charts.push(new Chart(document.getElementById('c1'),{type:'bar',data:{labels:sj.map(x=>x[0]),datasets:[{data:sj.map(x=>x[1]),backgroundColor:sj.map(x=>x[1]>=70?'#10b981':x[1]>=50?'#f59e0b':'#ef4444')}]},options:{scales:{y:{min:0,max:100}},plugins:{legend:{display:false}}}}));charts.push(new Chart(document.getElementById('c2'),{type:'line',data:{labels:D.mine.map((a,i)=>'#'+(i+1)),datasets:[{label:'Puntaje',data:D.mine.map(a=>a.score),borderColor:'#4f46e5',tension:.3}]},options:{scales:{y:{min:0,max:100}}}}))}
  if(tab==='prof'&&(D.all||[]).length){const sj=by(D.all);charts.push(new Chart(document.getElementById('c3'),{type:'bar',data:{labels:sj.map(x=>x[0]),datasets:[{data:sj.map(x=>x[1]),backgroundColor:'#6366f1'}]},options:{indexAxis:'y',scales:{x:{min:0,max:100}},plugins:{legend:{display:false}}}}))}
}
boot();
</script>
</body></html>
